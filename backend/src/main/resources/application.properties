spring.application.name=meson-lms-backend

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:meson_lms}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload.assignment.max-size-mb=20

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=false
spring.flyway.ignore-migration-patterns=*:missing

spring.sql.init.mode=never

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
server.port=8080

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# Transactional email (bulk-import temp-password notifications).
# Defaults to SendGrid's SMTP relay shape - swap MAIL_HOST/MAIL_USERNAME for
# another provider (e.g. Resend: smtp.resend.com, username "resend") without
# touching any code. Off by default (MAIL_ENABLED=false) until a real
# MAIL_PASSWORD (the provider's API key) is set, so nothing tries to send
# until that's actually configured.
mail.enabled=${MAIL_ENABLED:false}
mail.from=${MAIL_FROM:no-reply@meson-lms.com}
spring.mail.host=${MAIL_HOST:smtp.sendgrid.net}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:apikey}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha