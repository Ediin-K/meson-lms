# Activated via SPRING_PROFILES_ACTIVE=prod (or --spring.profiles.active=prod).
# Everything else (datasource, jwt.secret, CORS) already comes from env vars in the
# base application.properties — this profile only turns off dev-friendly verbosity.

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
