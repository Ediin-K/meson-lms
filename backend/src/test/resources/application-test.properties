spring.datasource.url=jdbc:h2:mem:meson_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.flyway.enabled=false
spring.sql.init.mode=never

app.upload.dir=target/test-uploads
app.upload.assignment.max-size-mb=20

mail.enabled=false

jwt.secret=dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIG1lc29uIGxtcyBhcHBsaWNhdGlvbg==
jwt.expiration=900000

# Generous by default so the many unrelated login POSTs across the suite (they all
# share one MockMvc "IP") never trip this — IpRateLimitTest overrides it down to
# actually exercise the feature, in its own isolated Spring context.
rate-limit.login.max-attempts=1000
rate-limit.login.window-minutes=15
